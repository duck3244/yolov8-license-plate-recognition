# config.yaml
# YOLOv8 번호판 인식 시스템 기본 설정
#
# 이 파일에 정의된 키는 모두 config_manager.SystemConfig 의 dataclass에 매핑됩니다.
# 매핑되지 않는 키를 추가해도 코드는 사용하지 않으므로, 새 옵션을 도입할 때는
# config_manager.py 의 dataclass와 _parse_config_data 도 함께 업데이트하세요.

model:
  yolo_model_path: "license_plate_det_yolov8.pt"
  confidence_threshold: 0.3
  device: "auto"  # auto, cpu, cuda, mps

ocr:
  tesseract_cmd: null  # null 이면 시스템 PATH 사용
  languages: "kor+eng"

database:
  path: "license_plates.db"

web:
  # FastAPI 서버 설정. 단일 사용자 MVP는 localhost 기본.
  # 환경별 오버라이드는 backend/.env (pydantic-settings) 사용 권장.
  host: "127.0.0.1"
  port: 8000
  debug: false
  upload_folder: "uploads"

logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "logs/license_plate_system.log"
  max_size_mb: 10
  backup_count: 5
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
